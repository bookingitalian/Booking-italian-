<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>الخدمات القنصلية الإيطالية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f9fc;color:#173b5b;font-family:Tahoma,Arial,sans-serif}
.header{height:92px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:1px solid #dce6ed;box-shadow:0 2px 12px #123b5b12}
.brand{display:flex;align-items:center;gap:12px}.brandmark{width:58px;height:58px;border-radius:50%;border:1px solid #ccdce6;display:grid;place-items:center;font-weight:900;color:#173b5b;background:#fff}.brand b{display:block;font-size:18px}.brand small{color:#71818d;font-size:11px}
.nav{display:flex;gap:27px;height:100%;align-items:center}.nav a{text-decoration:none;color:#294b63;font-weight:800;font-size:13px;padding:33px 4px;position:relative}.nav a.active{color:#168a5a}.nav a.active:after{content:"";position:absolute;bottom:15px;left:0;right:0;height:3px;background:#168a5a}
.login{border:1px solid #274d67;background:#fff;border-radius:11px;padding:11px 21px;font-weight:900;color:#274d67}
.full{position:relative;width:100%;overflow:hidden}.full img{width:100%;display:block;height:auto}.hot{position:absolute;z-index:2;background:transparent;border:0;cursor:pointer}
.hero .b1{left:76.2%;bottom:5.5%;width:20.3%;height:25%}.hero .b2{left:56.2%;bottom:5.5%;width:19.3%;height:25%}.hero .b3{left:32.8%;bottom:5.5%;width:22.5%;height:25%}
.services-wrap .hot{top:11%;height:72%}.services-wrap .s1{left:70%;width:20.3%}.services-wrap .s2{left:50.3%;width:18.1%}.services-wrap .s3{left:28.3%;width:20.4%}.services-wrap .s4{left:4.4%;width:22.3%}
.why{margin-top:18px}.footer{background:#123b5d;color:#fff;padding:28px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:12px}.flag{display:flex;width:80px;height:5px;margin-bottom:8px}.flag i{flex:1}.g{background:#168a5a}.w{background:#fff}.r{background:#e6333f}
@media(max-width:800px){.header{height:72px;padding:0 3%}.brand b{font-size:13px}.brand small{font-size:9px}.brandmark{width:45px;height:45px}.nav{display:none}.login{padding:8px 12px;font-size:10px}.hero .b1{left:76.2%;bottom:5.5%;width:20.3%;height:25%}.hero .b2{left:56.2%;bottom:5.5%;width:19.3%;height:25%}.hero .b3{left:32.8%;bottom:5.5%;width:22.5%;height:25%}.services-wrap .hot{top:9%;height:76%}.services-wrap .s1{left:70%;width:20.3%}.services-wrap .s2{left:50.3%;width:18.1%}.services-wrap .s3{left:28.3%;width:20.4%}.services-wrap .s4{left:4.4%;width:22.3%}.footer{flex-direction:column;text-align:center}}


#appModal{position:fixed;inset:0;background:#092d49aa;display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}
#appModal.show{display:flex}
.modalBox{width:min(560px,100%);background:#fff;border-radius:18px;box-shadow:0 18px 60px #062b4438;overflow:hidden}
.modalHead{background:#123b5d;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.modalHead h2{margin:0;font-size:20px}.closeBtn{border:0;background:#ffffff22;color:#fff;width:42px;height:42px;border-radius:10px;font-size:24px;cursor:pointer}
.modalBody{padding:22px}.formGrid{display:grid;gap:14px}.formGrid label{font-weight:800;font-size:13px}.formGrid input,.formGrid select{width:100%;padding:13px;border:1px solid #cbd9e2;border-radius:10px;font:inherit;margin-top:7px;outline:none}.formGrid input:focus,.formGrid select:focus{border-color:#168a5a;box-shadow:0 0 0 3px #168a5a18}
.modalActions{display:flex;gap:10px;margin-top:18px}.primary,.secondary{min-height:44px;padding:11px 18px;border-radius:10px;border:0;font-weight:900;cursor:pointer}.primary{background:#168a5a;color:#fff}.secondary{background:#eef4f7;color:#173b5b}.result{margin-top:14px;padding:13px;border-radius:10px;background:#eef8f3;color:#116b48;display:none;font-weight:800;line-height:1.8}
.serviceDetails{display:grid;gap:10px}.serviceDetails .row{border:1px solid #dce7ed;border-radius:10px;padding:13px}.serviceDetails b{display:block;margin-bottom:4px}
@media(max-width:520px){.modalBody{padding:16px}.modalHead{padding:14px 16px}}


.services-wrap{position:relative;overflow:hidden}
.services-scroll{width:100%;overflow:hidden}
.services-canvas{position:relative;width:100%;min-width:0}
.services-canvas img{width:100%;max-width:100%;height:auto;display:block}
</style>
<style>
/* طبقة التفاعل الجديدة — منفصلة عن القالب البصري */
.full, .hero, .services-wrap, .why { position:relative; }
.full > img { pointer-events:none; user-select:none; }
.hot { pointer-events:auto !important; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
button { font-family:inherit; }
</style>
</head>

    async function createBooking(booking) {
    requireSupabase();
    var res = await supabase.rpc('create_booking', {
      p_password: booking.password,
      p_service: booking.service,
      p_name: booking.name,
      p_identity: booking.identity,
      p_phone: booking.phone,
      p_date: booking.date
    });
    if (res.error) throw res.error;
    if (!res.data || res.data.success !== true) {
      throw new Error(res.data && res.data.message ? res.data.message : 'تعذر تسجيل الحجز');
    }
    return res.data;
  }

  async function getBooking(code, identity) {
    requireSupabase();
    var res = await supabase.rpc('get_booking', {
      p_code: code,
      p_identity: identity
    });
    if (res.error) throw res.error;
    return Array.isArray(res.data) ? (res.data[0] || null) : (res.data || null);
  }

  async function cancelBooking(code, identity, password) {
    requireSupabase();
    var res = await supabase.rpc('cancel_booking', {
      p_code: code,
      p_identity: identity,
      p_password: password
    });
    if (res.error) throw res.error;
    if (!res.data || res.data.success !== true) {
      throw new Error(res.data && res.data.message ? res.data.message : 'تعذر إلغاء الموعد');
    }
    return res.data;
  }

  async function markPaymentPaid(code, identity, password) {
    requireSupabase();
    var res = await supabase.rpc('mark_payment_paid', {
      p_code: code,
      p_identity: identity,
      p_password: password
    });
    if (res.error) throw res.error;
    if (!res.data || res.data.success !== true) {
      throw new Error(res.data && res.data.message ? res.data.message : 'تعذر تحديث حالة السداد');
    }
    return res.data;
  }

    document.body.appendChild(wrap);

    function invoiceRow(label, value) {
      return '<div style="display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #edf0f4;font-size:15px"><span style="color:#6d7685">' + escapeHtml(label) + '</span><strong style="color:#172033;max-width:58%;text-align:left;word-break:break-word">' + escapeHtml(value || 'غير متاح') + '</strong></div>';
    }

    try {
      var canvas = await window.html2canvas(wrap.firstElementChild, {
        scale: 2,
        backgroundColor: '#f4f7fb',
        useCORS: true,
        logging: false
      });
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({unit:'pt', format:'a4', orientation:'portrait'});
      var pageW = doc.internal.pageSize.getWidth();
      var pageH = doc.internal.pageSize.getHeight();
      var imgData = canvas.toDataURL('image/jpeg', 0.95);
      doc.addImage(imgData, 'JPEG', 0, 0, pageW, pageH, undefined, 'FAST');
      doc.save('payment-invoice-' + code + '.pdf');
    } catch (err) {
      console.error(err);
      alert('تعذر إنشاء الفاتورة الإلكترونية. حاول مرة أخرى.');
    } finally {
      wrap.remove();
    }
  }

  function bookingForm(preselected) {
    var options = Object.keys(services).map(function (key) {
      var selected = key === preselected ? ' selected' : '';
      return '<option value="' + key + '"' + selected + '>' + escapeHtml(services[key].name) + '</option>';
    }).join('');

    openModal('حجز موعد جديد',
      '<form class="formGrid" id="bookingForm">' +
        '<label>الخدمة<select name="service" required><option value="">اختر الخدمة</option>' + options + '</select></label>' +
        '<label>الاسم بالكامل<input name="name" type="text" required autocomplete="name"></label>' +
        '<label>رقم جواز السفر / الرقم القومي<input name="identity" type="text" required></label>' +
        '<label>رقم الهاتف<input name="phone" type="tel" required autocomplete="tel"></label>' +
        '<label>التاريخ المطلوب<input name="date" type="date" required></label>' +
        '<label>كلمة مرور التسجيل<input name="password" type="password" required autocomplete="off"></label>' +
        '<div class="modalActions"><button class="primary" type="submit">تأكيد حجز الموعد</button><button class="secondary" type="button" id="backBtn">رجوع</button></div>' +
        '<div class="result" id="formResult"></div>' +
      '</form>'
    );

    document.getElementById('backBtn').addEventListener('click', closeModal);
    document.getElementById('bookingForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fd = new FormData(e.currentTarget);
      var booking = {
        service: String(fd.get('service') || ''),
        name: String(fd.get('name') || '').trim(),
        identity: String(fd.get('identity') || '').trim(),
        phone: String(fd.get('phone') || '').trim(),
        date: String(fd.get('date') || ''),
        password: String(fd.get('password') || ''),
        status: 'قيد المراجعة',
        createdAt: new Date().toISOString()
      };
      if (!booking.service || !booking.name || !booking.identity || !booking.phone || !booking.date || !booking.password) return;
      var result = document.getElementById('formResult');
      result.style.display = 'block';
      result.textContent = 'جاري تسجيل الحجز...';
      try {
        var saved = await createBooking(booking);
        var code = saved && saved.code ? saved.code : booking.code;
        result.innerHTML = 'تم تسجيل طلبك بنجاح.<br>رقم الحجز: <strong>' + escapeHtml(code) + '</strong><br>الحالة: قيد المراجعة';
      } catch (err) {
        result.textContent = err && err.message ? err.message : 'تعذر تسجيل الحجز. حاول مرة أخرى.';
      }
    });
  }

  function inquiryForm() {
    openModal('الاستعلام عن الموعد',
      '<form class="formGrid" id="inquiryForm">' +
        '<label>رقم الحجز<input name="code" type="text" placeholder="mc12345678901" required></label>' +
        '<label>رقم جواز السفر / الرقم القومي<input name="identity" type="text" required></label>' +
        '<div class="modalActions"><button class="primary" type="submit">استعلام</button><button class="secondary" type="button" id="backBtn">رجوع</button></div>' +
        '<div class="result" id="formResult"></div>' +
      '</form>'
    );
    document.getElementById('backBtn').addEventListener('click', closeModal);
    document.getElementById('inquiryForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fd = new FormData(e.currentTarget);
      var code = String(fd.get('code') || '').trim();
      var identity = String(fd.get('identity') || '').trim();
      var result = document.getElementById('formResult');
      result.style.display = 'block';
      result.textContent = 'جاري البحث عن الحجز...';
      var booking = null;
      try {
        booking = await getBooking(code, identity);
      } catch (err) {
        result.textContent = err && err.message ? err.message : 'تعذر الاتصال بقاعدة البيانات.';
        return;
      }
      if (!booking || booking.identity !== identity) {
        result.textContent = 'لم يتم العثور على حجز مطابق.';
        return;
      }

      var serviceName = services[booking.service] ? services[booking.service].name : booking.service;
      var bookingDate = booking.booking_date || booking.date || '';
      var createdAt = booking.created_at || booking.createdAt || '';
      var dateText = bookingDate ? new Date(bookingDate + 'T00:00:00').toLocaleDateString('ar-EG') : 'غير متاح';
      var createdText = createdAt ? new Date(createdAt).toLocaleString('ar-EG') : 'غير متاح';
      var isPaid = String(booking.payment_status || '').toLowerCase() === 'paid';
      result.innerHTML =
        '<div><strong>رقم الحجز:</strong> ' + escapeHtml(booking.code || code) + '</div>' +
        '<div><strong>الاسم بالكامل:</strong> ' + escapeHtml(booking.name || 'غير متاح') + '</div>' +
        '<div><strong>الخدمة:</strong> ' + escapeHtml(serviceName || 'غير متاح') + '</div>' +
        '<div><strong>رقم جواز السفر / الرقم القومي:</strong> ' + escapeHtml(booking.identity || identity) + '</div>' +
        '<div><strong>رقم الهاتف:</strong> ' + escapeHtml(booking.phone || 'غير متاح') + '</div>' +
        '<div><strong>تاريخ الموعد:</strong> ' + escapeHtml(dateText) + '</div>' +
        '<div><strong>حالة الحجز:</strong> ' + escapeHtml(booking.status || 'غير متاح') + '</div>' +
        '<div><strong>حالة السداد:</strong> <span id="paymentStatusText">' + (isPaid ? 'تم دفع المبلغ' : 'يرجى دفع المبلغ') + '</span></div>' +
        '<div><strong>تاريخ تسجيل الحجز:</strong> ' + escapeHtml(createdText) + '</div>' +
        (isPaid ?
          '<div style="margin:14px 0;padding:16px;border-radius:12px;background:#e8f8ef;color:#116b48;border:1px solid #78c99a;font-weight:800;line-height:1.8">' +
          '<div style="font-size:1.05em;margin-bottom:6px">تم دفع المبلغ</div>' +
          '<div>المبلغ المسدد: <strong>8000 جنيه مصري</strong></div>' +
          '<div>تم تسجيل السداد في النظام.</div>' +
          '<button class="primary" type="button" id="downloadInvoiceBtn" style="margin-top:12px">تحميل فاتورة الدفع</button>' +
          '</div>' :
          '<div style="margin:14px 0;padding:16px;border-radius:12px;background:#fff4df;color:#805000;border:1px solid #e5b85c;font-weight:700;line-height:1.8">' +
          '<div style="font-size:1.05em;margin-bottom:6px">تنبيه مهم</div>' +
          '<div>المبلغ المطلوب: <strong>8000 جنيه مصري</strong></div>' +
          '<div>يتم سداد المبلغ واستلامه <strong>باليورو</strong> يوم موعد المقابلة.</div>' +
          '<div>القيمة التقريبية تُحسب حسب سعر الصرف وقت السداد.</div>' +
          '<button class="primary" type="button" id="markPaidBtn" style="margin-top:12px">تسجيل تم دفع المبلغ</button>' +
          '</div>') +
        (isPaid ? '' : '<div style="margin-top:12px;padding:12px;border-radius:10px;background:#e8f1ff;color:#173b5b"><strong>الوقت المتبقي حتى نهاية يوم التسجيل:</strong><div id="bookingCountdown" style="font-size:1.2em;margin-top:5px">جارٍ حساب الوقت...</div></div>');

      var downloadInvoiceBtn = document.getElementById('downloadInvoiceBtn');
      if (downloadInvoiceBtn) {
        downloadInvoiceBtn.addEventListener('click', function(){ downloadPaymentInvoice(booking); });
      }
      var markPaidBtn = document.getElementById('markPaidBtn');
      if (markPaidBtn) {
        markPaidBtn.addEventListener('click', async function(){
          var password = prompt('أدخل كلمة مرور الإدارة لتسجيل السداد:');
          if (password === null) return;
          markPaidBtn.disabled = true;
          markPaidBtn.textContent = 'جاري تحديث حالة السداد...';
          try {
            var paid = await markPaymentPaid(booking.code || code, booking.identity || identity, password);
            booking.payment_status = 'paid';
            booking.paid_at = paid.paid_at || new Date().toISOString();
            booking.payment_amount_egp = 8000;
            booking.payment_method = 'EUR';
            inquiryForm();
            setTimeout(function(){
              var body = document.getElementById('modalBody');
              if (body) {
                body.innerHTML = '<div class="result" style="display:block;background:#e8f8ef;color:#116b48"><strong>تم تحديث حالة السداد بنجاح.</strong><br>المبلغ: 8000 جنيه مصري.<br><button class="primary" type="button" id="downloadInvoiceAfterPaid" style="margin-top:12px">تحميل فاتورة الدفع</button></div>';
                document.getElementById('downloadInvoiceAfterPaid').addEventListener('click', function(){ downloadPaymentInvoice(booking); });
              }
            }, 50);
          } catch (err) {
            markPaidBtn.disabled = false;
            markPaidBtn.textContent = 'تسجيل تم دفع المبلغ';
            alert(err && err.message ? err.message : 'تعذر تحديث حالة السداد.');
          }
        });
      }

      var countdown = document.getElementById('bookingCountdown');
      if (countdown) {
        if (!createdAt || isNaN(new Date(createdAt).getTime())) {
          countdown.textContent = 'وقت التسجيل غير متاح.';
        } else {
          var createdDate = new Date(createdAt);
          var deadline = new Date(createdDate.getFullYear(), createdDate.getMonth(), createdDate.getDate() + 1, 0, 0, 0, 0);
          function updateBookingCountdown() {
            var left = deadline.getTime() - Date.now();
            if (left <= 0) {
              countdown.textContent = 'انتهى الوقت.';
              return;
            }
            var hours = Math.floor(left / 3600000);
            var minutes = Math.floor((left % 3600000) / 60000);
            var seconds = Math.floor((left % 60000) / 1000);
            countdown.textContent = hours + ' ساعة، ' + minutes + ' دقيقة، ' + seconds + ' ثانية';
          }
          updateBookingCountdown();
          var countdownTimer = setInterval(function () {
            if (!document.getElementById('bookingCountdown')) {
              clearInterval(countdownTimer);
              return;
            }
            updateBookingCountdown();
            if (Date.now() >= deadline.getTime()) clearInterval(countdownTimer);
          }, 1000);
        }
      }
    });
  }

  function cancelForm() {
    openModal('إلغاء الموعد',
      '<form class="formGrid" id="cancelForm">' +
        '<label>رقم الحجز<input name="code" type="text" placeholder="mc12345678901" required></label>' +
        '<label>رقم جواز السفر / الرقم القومي<input name="identity" type="text" required></label>' +
        '<label>كلمة مرور الإلغاء<input name="password" type="password" required autocomplete="off"></label>' +
        '<div class="modalActions"><button class="primary" type="submit">إلغاء الموعد</button><button class="secondary" type="button" id="backBtn">رجوع</button></div>' +
        '<div class="result" id="formResult"></div>' +
      '</form>'
    );
    document.getElementById('backBtn').addEventListener('click', closeModal);
    document.getElementById('cancelForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fd = new FormData(e.currentTarget);
      var code = String(fd.get('code') || '').trim();
      var identity = String(fd.get('identity') || '').trim();
      var password = String(fd.get('password') || '');
      var result = document.getElementById('formResult');
      result.style.display = 'block';
      var booking = null;
      try { booking = await getBooking(code, identity); } catch (err) { result.textContent = err && err.message ? err.message : 'تعذر الاتصال بقاعدة البيانات.'; return; }
      if (!booking || booking.identity !== identity) {
        result.textContent = 'بيانات الحجز غير صحيحة.';
        return;
      }
      if (booking.status === 'ملغى') {
        result.textContent = 'هذا الموعد ملغى بالفعل.';
        return;
      }
      try {
        await cancelBooking(code, identity, password);
        result.innerHTML = 'تم إلغاء الموعد بنجاح.<br>رقم الحجز: <strong>' + escapeHtml(booking.code) + '</strong>';
      } catch (err) {
        result.textContent = err && err.message ? err.message : 'تعذر إلغاء الموعد. حاول مرة أخرى.';
      }
    });
  }

  function showService(key) {
    var item = services[key];
    if (!item) return;
    openModal(item.name,
      '<div class="serviceDetails">' +
        '<div class="row"><b>الخدمة</b>' + escapeHtml(item.name) + '</div>' +
        '<div class="row"><b>التفاصيل</b>' + escapeHtml(item.description) + '</div>' +
        '<div class="row"><b>ملاحظة</b>' + escapeHtml(item.note) + '</div>' +
        '<div class="modalActions"><button class="primary" type="button" id="bookService">حجز موعد لهذه الخدمة</button><button class="secondary" type="button" id="backBtn">رجوع</button></div>' +
      '</div>'
    );
    document.getElementById('backBtn').addEventListener('click', closeModal);
    document.getElementById('bookService').addEventListener('click', function () { bookingForm(key); });
  }

  function loginForm() {
    openModal('تسجيل الدخول',
      '<form class="formGrid" id="loginForm">' +
        '<label>البريد الإلكتروني<input name="email" type="email" required autocomplete="username"></label>' +
        '<label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label>' +
        '<div class="modalActions"><button class="primary" type="submit">دخول</button><button class="secondary" type="button" id="backBtn">رجوع</button></div>' +
        '<div class="result" id="formResult"></div>' +
      '</form>'
    );
    document.getElementById('backBtn').addEventListener('click', closeModal);
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var result = document.getElementById('formResult');
      result.style.display = 'block';
      result.textContent = 'تم تسجيل الدخول بنجاح (وضع تجريبي).';
    });
  }

  /* ربط مباشر: كل زر له أمر واحد محدد، بدون event delegation */
  document.querySelector('.login').addEventListener('click', loginForm);
  document.querySelector('.hero .b1').addEventListener('click', bookingForm);
  document.querySelector('.hero .b2').addEventListener('click', cancelForm);
  document.querySelector('.hero .b3').addEventListener('click', inquiryForm);
  document.querySelector('.services-wrap .s1').addEventListener('click', function () { showService('national'); });
  document.querySelector('.services-wrap .s2').addEventListener('click', function () { showService('schengen'); });
  document.querySelector('.services-wrap .s3').addEventListener('click', function () { showService('consular'); });
  document.querySelector('.services-wrap .s4').addEventListener('click', function () { showService('attestation'); });

  /* روابط القائمة */
  document.querySelectorAll('.nav a').forEach(function (link) {
    link.addEventListener('click', function (e) {
      var href = link.getAttribute('href');
      if (href === '#check') {
        e.preventDefault();
        inquiryForm();
        return;
      }
      if (href && href.charAt(0) === '#') {
        var target = document.querySelector(href);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({behavior:'smooth', block:'start'});
          document.querySelectorAll('.nav a').forEach(function (a) { a.classList.remove('active'); });
          link.classList.add('active');
        }
      }
    });
  });
})();
</script>
</body>
</html>
